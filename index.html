    <!-- ✅ EMERGENCY FIX: Redirect all API calls to Render backend -->
    <script>
      const originalFetch = window.fetch;
      window.fetch = function(url, options) {
        let newUrl = url;
        if (typeof url === 'string') {
          if (url.includes('portfolio-frontend-rust-six.vercel.app/api')) {
            newUrl = url.replace(
              'https://portfolio-frontend-rust-six.vercel.app/api',
              'https://portfolio-backend-2-ly21.onrender.com/api'
            );
          }
          if (url.startsWith('/api/')) {
            newUrl = 'https://portfolio-backend-2-ly21.onrender.com' + url;
          }
        }
        return originalFetch(newUrl, options);
      };
      console.log('✅ API Redirect Active → All calls go to portfolio-backend-2-ly21.onrender.com');
    </script>
  </body>
